<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Godi - Registro</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; padding: 20px; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; background: #161b22; border: 1px solid #30363d; color: white; }
        button { background: #00ff9d; color: black; padding: 10px; border: none; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Preenchimento Comercial</h2>
    <input type="text" id="faturamento" placeholder="Faturamento do Dia">
    <button onclick="salvar()">SALVAR</button>

    <script>
        function salvar() {
            const val = document.getElementById('faturamento').value;
            alert('Dados salvos localmente: ' + val);
            // Aqui você poderia adicionar o envio para o Google Sheets
        }
    </script>
</body>
</html>
